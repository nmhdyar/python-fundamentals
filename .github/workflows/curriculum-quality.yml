name: Curriculum quality checks

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  verify-chapters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and execute paired lessons
        run: python tools/verify_curriculum.py
